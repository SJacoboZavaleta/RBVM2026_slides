<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#07161C"/>
      <stop offset="44%" stop-color="#0A303B"/>
      <stop offset="100%" stop-color="#105F6D"/>
    </linearGradient>
    <radialGradient id="wash" cx="82%" cy="42%" r="42%">
      <stop offset="0%" stop-color="#31ADAB" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#31ADAB" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <path id="trackPath" d="M84 442 C186 392 288 392 390 442 C492 492 594 492 696 442 C798 392 900 392 1002 442 C1084 482 1162 482 1240 458"/>
    <path id="idealPath" d="M84 360 C186 330 288 330 390 360 C492 390 594 390 696 360 C798 330 900 330 1002 360 C1084 386 1162 386 1240 370"/>
    <path id="corrPath" d="M470 524 C560 540 650 530 740 492 C840 448 926 430 1012 440"/>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#wash)"/>

  <path d="M84 360 C186 330 288 330 390 360 C492 390 594 390 696 360 C798 330 900 330 1002 360 C1084 386 1162 386 1240 370" fill="none" stroke="#DDEFEF" stroke-width="1.2" opacity="0.20" stroke-dasharray="6 9"/>
  <path d="M84 442 C186 392 288 392 390 442 C492 492 594 492 696 442 C798 392 900 392 1002 442 C1084 482 1162 482 1240 458" fill="none" stroke="#89DEDE" stroke-width="1.9" opacity="0.56"/>
  <path d="M470 524 C560 540 650 530 740 492 C840 448 926 430 1012 440" fill="none" stroke="#89DEDE" stroke-width="1.5" opacity="0.36"/>

  <g fill="#0F3C47" opacity="0.62" stroke="#8ADDDD" stroke-opacity="0.22">
    <rect x="450" y="500" width="128" height="52" rx="14"/>
    <rect x="832" y="418" width="128" height="52" rx="14"/>
    <circle cx="1012" cy="440" r="16"/>
  </g>

  <!-- tracked motion and correction -->
  <circle r="6.4" fill="#7DDDDD" filter="url(#glow)">
    <animateMotion dur="9.8s" repeatCount="indefinite"><mpath href="#trackPath"/></animateMotion>
  </circle>
  <circle r="5.4" fill="#E7C25E" filter="url(#glow)">
    <animateMotion dur="7.6s" begin="0.8s" repeatCount="indefinite"><mpath href="#trackPath"/></animateMotion>
  </circle>
  <circle r="5.6" fill="#7DDDDD" filter="url(#glow)">
    <animateMotion dur="6.2s" begin="1.5s" repeatCount="indefinite"><mpath href="#corrPath"/></animateMotion>
  </circle>

  <!-- error shrinking visual -->
  <g stroke="#E7C25E" stroke-width="1.3" opacity="0.42">
    <line x1="1012" y1="440" x2="1012" y2="360">
      <animate attributeName="y2" values="360;388;368;440;360" dur="7s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
