  <path d="M772 226 H1204" fill="none" stroke="#DDEFEF" stroke-width="1.2" opacity="0.18" stroke-dasharray="7 10"/>
  <path d="M744 456 C812 428 880 428 948 456 C1016 484 1084 484 1152 456 C1190 442 1224 438 1260 442" fill="none" stroke="#89DEDE" stroke-width="1.9" opacity="0.58"/>
