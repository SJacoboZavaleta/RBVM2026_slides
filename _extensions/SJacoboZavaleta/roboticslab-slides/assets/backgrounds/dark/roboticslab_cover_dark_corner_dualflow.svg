<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#07161C"/>
      <stop offset="45%" stop-color="#0A3340"/>
      <stop offset="100%" stop-color="#116675"/>
    </linearGradient>
    <radialGradient id="washL" cx="18%" cy="18%" r="30%">
      <stop offset="0%" stop-color="#31ADAB" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#31ADAB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="washR" cx="84%" cy="82%" r="36%">
      <stop offset="0%" stop-color="#7FD8DA" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7FD8DA" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="tlPath" d="M95 118 C165 100 235 96 315 112 C380 124 430 160 466 210"/>
    <path id="brPath" d="M868 540 C954 500 1040 490 1130 512 C1188 526 1232 556 1260 596"/>
    <path id="diagPath" d="M126 586 C260 566 366 520 468 520 C602 520 650 592 778 592 C918 592 1012 526 1156 470"/>
    <path id="microOrbit" d="M0 -70 A70 70 0 1 1 0 70 A70 70 0 1 1 0 -70"/>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#washL)"/>
  <rect width="1280" height="720" fill="url(#washR)"/>

  <!-- top-left moving micro system -->
  <g transform="translate(240 146)" opacity="0.72">
    <circle r="70" fill="none" stroke="#8CDDDD" stroke-width="1.3" opacity="0.40"/>
    <circle r="52" fill="none" stroke="#DDEFEF" stroke-width="1" opacity="0.14"/>
    <path d="M-145 -12 C-88 -28 -20 -28 48 -8" fill="none" stroke="#8CDDDD" stroke-width="1.4" opacity="0.72"/>
    <circle r="5" fill="#81E2E1" filter="url(#glow)">
      <animateMotion dur="8.5s" repeatCount="indefinite" rotate="auto"><mpath href="#microOrbit"/></animateMotion>
    </circle>
    <circle r="7" fill="#81E2E1" opacity="0.07">
      <animate attributeName="r" values="7;11;7" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.05;0.14;0.05" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <path d="M95 118 C165 100 235 96 315 112 C380 124 430 160 466 210" fill="none" stroke="#8CDDDD" stroke-width="1.4" opacity="0.52"/>
  <circle r="5.8" fill="#7CDADB" filter="url(#glow)">
    <animateMotion dur="7.2s" repeatCount="indefinite" rotate="auto"><mpath href="#tlPath"/></animateMotion>
  </circle>

  <!-- bottom-right motion field -->
  <g transform="translate(1088 544)" opacity="0.78">
    <path d="M-182 12 C-106 -28 -28 -38 62 -16 C114 -2 164 28 212 68" fill="none" stroke="#8CDDDD" stroke-width="1.6" opacity="0.74"/>
    <path d="M-142 56 C-32 -6 90 -8 188 40" fill="none" stroke="#DDEFEF" stroke-width="1" opacity="0.16"/>
    <circle cx="172" cy="76" r="3.5" fill="#79DADD"/>
  </g>
  <path d="M868 540 C954 500 1040 490 1130 512 C1188 526 1232 556 1260 596" fill="none" stroke="#8CDDDD" stroke-width="1.6" opacity="0.56"/>
  <circle r="6.6" fill="#7ADBDC" filter="url(#glow)">
    <animateMotion dur="8.6s" begin="0.5s" repeatCount="indefinite" rotate="auto"><mpath href="#brPath"/></animateMotion>
  </circle>

  <!-- long lower connector -->
  <path d="M126 586 C260 566 366 520 468 520 C602 520 650 592 778 592 C918 592 1012 526 1156 470" fill="none" stroke="#89DEDE" stroke-width="1.7" opacity="0.44"/>
  <circle r="6.4" fill="#74D8D9" filter="url(#glow)">
    <animateMotion dur="12s" repeatCount="indefinite" rotate="auto"><mpath href="#diagPath"/></animateMotion>
  </circle>

  <g stroke="#8CDDDD" fill="none" opacity="0.14">
    <path d="M1036 92 H1238"/>
    <path d="M1064 114 H1238"/>
    <path d="M90 646 H292"/>
  </g>
</svg>
