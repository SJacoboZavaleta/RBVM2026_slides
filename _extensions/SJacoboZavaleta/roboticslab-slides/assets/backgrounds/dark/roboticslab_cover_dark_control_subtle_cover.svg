<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0C6176"/>
      <stop offset="38%" stop-color="#0B5A6E"/>
      <stop offset="100%" stop-color="#0A3F4E"/>
    </linearGradient>
    <radialGradient id="glowField" cx="83%" cy="50%" r="34%">
      <stop offset="0%" stop-color="#BEEBED" stop-opacity="0.05"/>
      <stop offset="55%" stop-color="#8ADDDD" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#8ADDDD" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- animation paths aligned to the right side so text area stays clean -->
    <path id="forwardPath" d="M920 362 H950 H1028 H1118 H1192"/>
    <path id="feedbackPath" d="M1192 362 V500 H1088 H980 H950 V388"/>
  </defs>

  <!-- background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glowField)"/>

  <!-- very subtle right-side atmosphere -->
  <circle cx="1096" cy="364" r="188" fill="#8ADDDD" opacity="0.035"/>
  <circle cx="1096" cy="364" r="142" fill="none" stroke="#BEEBED" stroke-opacity="0.08" stroke-width="1.3"/>
  <circle cx="1096" cy="364" r="188" fill="none" stroke="#BEEBED" stroke-opacity="0.05" stroke-width="1.3"/>

  <!-- control motif on right side -->
  <g fill="none" stroke="#CBEFF0" stroke-opacity="0.28" stroke-width="2">
    <!-- forward -->
    <path d="M920 362 H950"/>
    <path d="M972 362 H1028"/>
    <path d="M1094 362 H1118"/>
    <path d="M1170 362 H1192"/>
    <!-- feedback -->
    <path d="M1192 362 V500 H1088"/>
    <path d="M1032 500 H980"/>
    <path d="M980 500 H950 V388"/>
  </g>

  <!-- blocks / nodes kept subtle -->
  <g fill="#0D5364" fill-opacity="0.18" stroke="#D8F4F5" stroke-opacity="0.16">
    <circle cx="950" cy="362" r="22"/>
    <rect x="1028" y="326" width="66" height="72" rx="12"/>
    <rect x="1118" y="326" width="52" height="72" rx="12"/>
    <rect x="1032" y="478" width="56" height="44" rx="12"/>
  </g>

  <!-- summing cross -->
  <g stroke="#EAF8F8" stroke-opacity="0.24" stroke-width="1.35">
    <path d="M938 350 L962 374"/>
    <path d="M962 350 L938 374"/>
  </g>

  <!-- subtle decorative guide lines to integrate with cover style -->
  <g fill="none" stroke="#DFF6F7" stroke-opacity="0.10" stroke-width="1.2">
    <path d="M1088 106 h86"/>
    <path d="M1088 122 h112"/>
    <path d="M1118 612 h68" stroke-dasharray="7 8"/>
  </g>

  <!-- animated control signal -->
  <circle r="5.8" fill="#A8F2F2" filter="url(#glow)">
    <animateMotion dur="12.5s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.57;1">
      <mpath href="#forwardPath"/>
    </animateMotion>
    <animate attributeName="opacity" dur="12.5s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.569;0.57;1"/>
  </circle>

  <!-- animated feedback response -->
  <circle r="5.3" fill="#E6C76A" filter="url(#glow)">
    <animateMotion dur="12.5s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1" keyTimes="0;0.57;1">
      <mpath href="#feedbackPath"/>
    </animateMotion>
    <animate attributeName="opacity" dur="12.5s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.569;0.57;1"/>
  </circle>
</svg>
