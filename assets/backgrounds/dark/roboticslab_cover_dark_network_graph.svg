<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#07151B"/>
      <stop offset="46%" stop-color="#0A2E3A"/>
      <stop offset="100%" stop-color="#10606D"/>
    </linearGradient>
    <radialGradient id="wash" cx="82%" cy="38%" r="42%">
      <stop offset="0%" stop-color="#31ADAB" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#31ADAB" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <path id="edge1" d="M792 164 L958 126 L1138 170"/>
    <path id="edge2" d="M792 164 L862 286 L1036 250 L1138 170"/>
    <path id="edge3" d="M862 286 L806 448 L982 496 L1150 420 L1036 250"/>
    <path id="edge4" d="M958 126 L1036 250 L1150 420"/>
    <path id="edge5" d="M806 448 L916 606 L1098 590 L1150 420"/>
    <path id="edge6" d="M916 606 L1230 552"/>
    <path id="edge7" d="M1036 250 L1224 294"/>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#wash)"/>

  <g stroke="#8ADDDD" fill="none" stroke-width="1.4" opacity="0.32">
    <use href="#edge1"/>
    <use href="#edge2"/>
    <use href="#edge3"/>
    <use href="#edge4"/>
    <use href="#edge5"/>
    <use href="#edge6"/>
    <use href="#edge7"/>
  </g>

  <g fill="#E1F1F2" opacity="0.30">
    <circle cx="792" cy="164" r="8"/>
    <circle cx="958" cy="126" r="8"/>
    <circle cx="1138" cy="170" r="8"/>
    <circle cx="862" cy="286" r="8"/>
    <circle cx="1036" cy="250" r="8"/>
    <circle cx="1224" cy="294" r="6"/>
    <circle cx="806" cy="448" r="8"/>
    <circle cx="982" cy="496" r="8"/>
    <circle cx="1150" cy="420" r="8"/>
    <circle cx="916" cy="606" r="8"/>
    <circle cx="1098" cy="590" r="8"/>
    <circle cx="1230" cy="552" r="6"/>
  </g>

  <g fill="#7FD8DA" opacity="0.85">
    <circle cx="792" cy="164" r="3"/>
    <circle cx="958" cy="126" r="3"/>
    <circle cx="1138" cy="170" r="3"/>
    <circle cx="862" cy="286" r="3"/>
    <circle cx="1036" cy="250" r="3"/>
    <circle cx="806" cy="448" r="3"/>
    <circle cx="982" cy="496" r="3"/>
    <circle cx="1150" cy="420" r="3"/>
    <circle cx="916" cy="606" r="3"/>
    <circle cx="1098" cy="590" r="3"/>
  </g>

  <!-- pulses moving through the graph -->
  <circle r="6.2" fill="#7CDDDD" filter="url(#glow)">
    <animateMotion dur="7.6s" repeatCount="indefinite"><mpath href="#edge2"/></animateMotion>
  </circle>
  <circle r="5.2" fill="#E7C25E" filter="url(#glow)">
    <animateMotion dur="6.2s" begin="1.1s" repeatCount="indefinite"><mpath href="#edge4"/></animateMotion>
  </circle>
  <circle r="5.8" fill="#7CDDDD" filter="url(#glow)">
    <animateMotion dur="8.8s" begin="0.5s" repeatCount="indefinite"><mpath href="#edge5"/></animateMotion>
  </circle>
  <circle r="5.0" fill="#E7C25E" filter="url(#glow)">
    <animateMotion dur="7.4s" begin="1.8s" repeatCount="indefinite"><mpath href="#edge3"/></animateMotion>
  </circle>

  <!-- subtle node breathing -->
  <g fill="#7FD8DA" opacity="0.10">
    <circle cx="1036" cy="250" r="10">
      <animate attributeName="r" values="10;16;10" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.08;0.18;0.08" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1150" cy="420" r="10">
      <animate attributeName="r" values="10;16;10" dur="4.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.08;0.16;0.08" dur="4.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g stroke="#8CDDDD" fill="none" opacity="0.12">
    <path d="M1034 88 H1230"/>
    <path d="M1068 110 H1230"/>
  </g>
</svg>
